services:
  db:
    image: postgres:15.3-alpine
    container_name: expanse-api-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expanse
    ports:
      - "5432:5432"
    volumes:
      - notes-api-db-data:/var/lib/postgresql/data
volumes:
  notes-api-db-data:
